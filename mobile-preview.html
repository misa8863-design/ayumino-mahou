<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>スマホプレビュー | あゆみのまほう</title>
    <style>
      :root {
        color: #8b6b5c;
        background: #e9ddd2;
        font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        padding: 24px;
      }

      .preview-shell {
        width: min(390px, 100%);
      }

      .preview-label {
        margin: 0 0 12px;
        font-size: 13px;
        text-align: center;
      }

      iframe {
        display: block;
        width: 390px;
        max-width: 100%;
        height: 844px;
        background: #f7f2ec;
        border: 1px solid rgba(139, 107, 92, 0.22);
        border-radius: 28px;
        box-shadow: 0 18px 48px rgba(78, 55, 45, 0.2);
      }
    </style>
  </head>
  <body>
    <main class="preview-shell">
      <p class="preview-label">スマホ幅プレビュー</p>
      <iframe src="index.html?preview=mobile" title="あゆみのまほう スマホプレビュー"></iframe>
    </main>
  </body>
</html>
